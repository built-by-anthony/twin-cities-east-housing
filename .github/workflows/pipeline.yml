name: Housing Data Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "data/raw/**"
      - "src/**"
      - "main.py"
  schedule:
    - cron: "0 6 2 * *"  # 1st of every month at 6am UTC
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python main.py

      - name: Upload DuckDB artifact
        uses: actions/upload-artifact@v4
        with:
          name: housing-db
          path: data/housing.duckdb
          retention-days: 30
